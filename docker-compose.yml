# Shveyka: сайт, Telegram-бот и обратный прокси.
#
# Перед запуском проверь, что есть файлы с переменными:
#   .env                — общие настройки (DATABASE_URL, ключи AI)
#   apps/bot/.env       — BOT_TOKEN, SITE_URL, DATA_DIR
#
# Запуск: docker compose up -d --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    # Файлы читаются по порядку: следующий перекрывает предыдущий.
    env_file:
      - .env
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      # Главная страница статическая, базу не дёргает
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
      - apps/bot/.env
    environment:
      # Адрес сайта изнутри сети: бот пишет в общий журнал шитья
      WEB_API_URL: http://web:3000
    volumes:
      # История проектов и состояние диалогов переживают пересборку
      - bot-data:/app/apps/bot/data
    restart: unless-stopped
    # init: tini становится PID 1 и передаёт боту SIGTERM —
    # бот корректно завершает long polling
    init: true

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - web

volumes:
  bot-data:
  caddy_data:
  caddy_config:
